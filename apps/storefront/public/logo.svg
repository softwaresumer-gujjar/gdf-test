<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Blue circle background -->
  <circle cx="100" cy="100" r="100" fill="#1875D1"/>

  <!-- Bird / pigeon silhouette (stylized, matching the logo) -->
  <g transform="translate(100,62) scale(0.9)" fill="white">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="18" ry="12" transform="rotate(-10)"/>
    <!-- Head -->
    <circle cx="20" cy="-10" r="9"/>
    <!-- Beak -->
    <polygon points="28,-11 36,-10 28,-7" fill="white"/>
    <!-- Tail -->
    <polygon points="-18,4 -34,0 -30,10 -18,8" fill="white"/>
    <!-- Wing highlight -->
    <ellipse cx="-2" cy="2" rx="13" ry="6" fill="rgba(24,117,209,0.35)" transform="rotate(-8)"/>
    <!-- Eye -->
    <circle cx="22" cy="-12" r="2.2" fill="#1875D1"/>
    <!-- Registered mark -->
  </g>

  <!-- ® symbol -->
  <text x="146" y="52" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="400">®</text>

  <!-- Urdu text: گجر ڈیری -->
  <text
    x="100" y="116"
    text-anchor="middle"
    font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Arial Unicode MS', serif"
    font-size="30"
    font-weight="700"
    fill="white"
    direction="rtl"
  >گجر ڈیری</text>

  <!-- Tagline: نام ہی پہچان ہے -->
  <text
    x="100" y="146"
    text-anchor="middle"
    font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Arial Unicode MS', serif"
    font-size="13"
    fill="rgba(255,255,255,0.85)"
    direction="rtl"
  >نام ہی پہچان ہے</text>

  <!-- Milk splash decorative dots -->
  <circle cx="30" cy="150" r="5" fill="white" opacity="0.6"/>
  <circle cx="20" cy="138" r="3" fill="white" opacity="0.4"/>
  <circle cx="38" cy="162" r="3.5" fill="white" opacity="0.5"/>
  <circle cx="170" cy="150" r="5" fill="white" opacity="0.6"/>
  <circle cx="180" cy="138" r="3" fill="white" opacity="0.4"/>
  <circle cx="162" cy="162" r="3.5" fill="white" opacity="0.5"/>
</svg>
